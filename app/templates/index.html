<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriSaarthi AI - Your Intelligent Farming Companion</title>

    <meta name="description"
        content="AgriSaarthi AI is an intelligent farming companion that helps farmers with crop advice, plant disease detection, soil guidance, and agricultural information using AI.">

    <meta name="keywords"
        content="AgriSaarthi AI, agriculture, farming, India, crops, pest control, soil health, AI assistant, chatbot, crop disease, fertilizers, irrigation">

    <meta name="author" content="N Shiva Kumar Reddy & Team">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a1628">


    <!-- =========================================================
         CANONICAL URL
         ========================================================= -->

    <link rel="canonical" href="http://127.0.0.1:5000/">


    <!-- =========================================================
         OPEN GRAPH / FACEBOOK
         ========================================================= -->

    <meta property="og:type" content="website">
    <meta property="og:url" content="http://127.0.0.1:5000/">
    <meta property="og:title" content="AgriSaarthi AI - Your Intelligent Farming Companion">
    <meta property="og:description"
        content="An intelligent AI agriculture assistant for crop advice, plant disease detection, soil guidance, and farming information.">
    <meta property="og:site_name" content="AgriSaarthi AI">
    <meta property="og:locale" content="en_IN">


    <!-- =========================================================
         TWITTER CARD
         ========================================================= -->

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AgriSaarthi AI - Your Intelligent Farming Companion">
    <meta name="twitter:description"
        content="AI-powered agriculture assistant for farmers with text, voice, and image analysis.">


    <!-- =========================================================
         AI CRAWLERS
         ========================================================= -->

    <meta name="llms-txt" content="/llms.txt">
    <meta name="ai-content-declaration" content="human-reviewed">


    <!-- =========================================================
         STRUCTURED DATA
         ========================================================= -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AgriSaarthi AI",
        "alternateName": "Your Intelligent Farming Companion",
        "url": "http://127.0.0.1:5000/",
        "description": "AgriSaarthi AI is an intelligent agriculture assistant that helps farmers with crop advice, plant disease detection, soil guidance and agricultural information.",
        "applicationCategory": "AgricultureApplication",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
        },
        "author": {
            "@type": "Organization",
            "name": "N Shiva Kumar Reddy & Team"
        },
        "inLanguage": [
            "en",
            "te",
            "kn",
            "hi"
        ],
        "featureList": [
            "AI Crop Advice",
            "Crop Disease Detection",
            "Voice Input",
            "Voice Output",
            "Agricultural Advisory",
            "Image Analysis",
            "Multilingual Support"
        ]
    }
    </script>


    <!-- =========================================================
         BOOTSTRAP 5
         ========================================================= -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =========================================================
         BOOTSTRAP ICONS
         ========================================================= -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <!-- =========================================================
         GOOGLE FONT
         ========================================================= -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- =========================================================
         CUSTOM CSS
         ========================================================= -->

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">


    <!-- =========================================================
         FAVICON
         ========================================================= -->

    <link rel="icon"
        type="image/x-icon"
        href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link rel="apple-touch-icon"
        href="{{ url_for('static', filename='images/favicon.ico') }}">


    <!-- =========================================================
         MANIFEST
         ========================================================= -->

    <link rel="manifest"
        href="{{ url_for('static', filename='manifest.webmanifest') }}">

</head>


<body>


    <!-- =========================================================
         NAVBAR
         ========================================================= -->

    <nav class="navbar">

        <div class="nav-inner">


            <!-- Brand -->

            <a class="brand" href="/">

                <!-- AgriSaarthi Icon -->

                <span class="brand-icon"
                    style="background: transparent; box-shadow: none;">

                    <img
                        src="{{ url_for('static', filename='images/agrisaarthi-icon.png') }}"
                        alt="AgriSaarthi AI"
                        style="width: 100%; height: 100%; object-fit: contain;">

                </span>

                <img
                    src="{{ url_for('static', filename='images/agrisaarthi-wordmark.png') }}"
                    alt="AgriSaarthi AI"
                    class="brand-wordmark"
                >

            </a>


            <!-- Navigation Actions -->

            <div class="nav-actions">


                <!-- New Chat -->

                <button
                    class="nav-btn"
                    id="clearBtn"
                    title="Clear conversation">

                    <i class="bi bi-trash3"></i>

                    <span class="btn-label">
                        New Chat
                    </span>

                </button>
                <!-- My Farm -->
                <button
                    class="nav-btn"
                    id="farmProfileBtn"
                    title="My Farm">

                    <i class="bi bi-house-heart"></i>

                    <span class="btn-label">
                        My Farm
                    </span>

                </button>


                <!-- Theme -->

                <button
                    class="nav-btn"
                    id="themeToggle"
                    title="Toggle theme">

                    <i
                        class="bi bi-moon-stars-fill"
                        id="themeIcon">
                    </i>

                </button>


            </div>

        </div>

    </nav>



    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="main">


        <div class="chat-card">


            <!-- =================================================
                 CHAT HEADER
                 ================================================= -->

            <div class="card-header">


                <div class="header-left">


                    <!-- Bot Avatar -->

                    <div class="avatar"
                        style="background: transparent; box-shadow: none;">

                        <img
                            src="{{ url_for('static', filename='images/agrisaarthi-icon.png') }}"
                            alt="AgriSaarthi AI"
                            style="width: 100%; height: 100%; object-fit: contain;">

                    </div>


                    <!-- Bot Information -->

                    <div>

                        <img
                            src="{{ url_for('static', filename='images/agrisaarthi-wordmark.png') }}"
                            alt="AgriSaarthi AI"
                            class="chat-wordmark"
                        >


                        <span class="status">

                            <i class="bi bi-circle-fill"></i>

                            Online

                        </span>

                    </div>


                </div>


                <!-- Date -->

                <span
                    class="date"
                    id="dateDisplay">
                </span>


            </div>



            <!-- =================================================
                 CHAT MESSAGES
                 ================================================= -->

            <div
                class="messages"
                id="chatMessages">
            </div>



            <!-- =================================================
                 TYPING INDICATOR
                 ================================================= -->

            <div
                class="typing"
                id="typingIndicator">


                <span class="dot"></span>

                <span class="dot"></span>

                <span class="dot"></span>


                <span class="typing-label">
                    AgriSaarthi AI is thinking...
                </span>


            </div>



            <!-- =================================================
                 IMAGE PREVIEW
                 ================================================= -->

            <div
                class="image-preview"
                id="imagePreview">


                <img
                    id="previewImg"
                    src=""
                    alt="Selected crop image">


                <button
                    class="remove-image"
                    id="removeImage"
                    title="Remove image">

                    <i class="bi bi-x-lg"></i>

                </button>


            </div>



            <!-- =================================================
                 INPUT BAR
                 ================================================= -->

            <div class="input-bar">


                <!-- Image Upload -->

                <button
                    class="icon-btn"
                    id="imageBtn"
                    title="Upload crop image">

                    <i class="bi bi-image"></i>

                </button>


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    class="d-none"
                    title="Upload crop image"
                    aria-label="Upload crop image"
                >


                <!-- Voice Input -->

                <button
                    class="icon-btn mic"
                    id="voiceBtn"
                    title="Record voice">

                    <i class="bi bi-mic"></i>

                </button>



                <!-- Chat Form -->

                <form
                    id="chatForm"
                    class="input-row"
                    autocomplete="off">


                    <input
                        type="text"
                        class="chat-input"
                        id="userInput"
                        placeholder="Ask about crops, pests, soil, or send a photo..."
                        aria-label="Message"
                    >


                    <!-- Send -->

                    <button
                        type="submit"
                        class="send-btn"
                        id="sendBtn"
                        title="Send message">

                        <i class="bi bi-send-fill"></i>

                    </button>


                </form>


            </div>


        </div>


    </main>



    <!-- =========================================================
         AUDIO PLAYER
         ========================================================= -->

    <audio
        id="audioPlayer"
        class="d-none">
    </audio>



    <!-- =========================================================
         FOOTER
         ========================================================= -->

    <footer class="footer">

        <p>
            Developed by NSKReddy &amp; Team
        </p>

    </footer>



    <!-- =========================================================
         JQUERY
         ========================================================= -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>



    <!-- =========================================================
         CUSTOM JAVASCRIPT
         ========================================================= -->

    <script src="{{ url_for('static', filename='js/chat.js') }}">
    </script>


</body>

</html>
